[package]
name = "nightjar-slicer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Resume-safe preparation of long bird recordings for audio analyzers"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-bird-audio-slicer"
readme = "README.md"
keywords = ["audio", "birding", "wav", "flac", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "nightjar"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", default-features = false, features = ["flac", "pcm", "wav"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
